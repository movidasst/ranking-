name: Validar Ranking SST
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Pruebas de compatibilidad y privacidad
        run: node tests/smoke.js
      - name: Verificar archivos públicos
        run: |
          test -s CNAME
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          test -s assets/og-ranking.png
          test -s assets/icon.svg
